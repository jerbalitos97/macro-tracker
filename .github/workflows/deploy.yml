name: Deploy

# Tuotantoon menee vain se, mikä on läpäissyt savutestit.
#
# Tämä workflow käynnistyy, kun Smoke-workflow valmistuu mainin pushille, ja
# kutsuu Vercelin Deploy Hookia vain jos Smoke oli vihreä.
#
# Miksi tämä on olemassa: Vercelin Git-integraatio ohittaa commitit, joiden
# tekijä ei ole projektin jäsen. Iltainen palauteautomaatio commitoi eri
# GitHub-tilillä kuin projektin omistaja, joten sen mergeämät muutokset eivät
# julkaistuisi koskaan. Deploy Hook on projektin oma URL, joka käynnistää
# deployn mainin kärjestä riippumatta siitä, kuka commitin teki.
#
# Vercelin oma Git-deploy on toistaiseksi yhä päällä, joten omistajan omat
# pushit deployautuvat kahdesti. Se on harmitonta; kytke se pois vasta kun
# tämä reitti on todettu toimivaksi.
#
# Hook deployaa mainin kärjen, ei välttämättä juuri testattua committia. Jos
# mainiin ehtii tulla uusi commit Smoken aikana, sekin julkaistaan — ja sen
# oma Smoke-ajo käynnistää tämän uudelleen.
#
# Repository secret (Settings → Secrets and variables → Actions):
#   VERCEL_DEPLOY_HOOK   Vercel → macro-tracker → Settings → Git → Deploy Hooks
# Ilman sitä workflow ohittaa deployn ja kertoo sen.

on:
  workflow_run:
    workflows: [Smoke]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  vercel:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel production deploy
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::VERCEL_DEPLOY_HOOK is not set — skipping deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
